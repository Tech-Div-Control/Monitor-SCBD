<style>

*{box-sizing:border-box}
html{font-size:17px}

header{position:relative;overflow:hidden;background:linear-gradient(120deg,#06214f 0%,#0a4cc2 55%,#14a0ff 100%);color:#fff;padding:26px 36px 54px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
header:before{content:"";position:absolute;right:-120px;top:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 68%)}
header:after{content:"";position:absolute;left:38%;bottom:-210px;width:520px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(120,210,255,.28),rgba(255,255,255,0) 70%)}
header>*{position:relative;z-index:1}

header h1 span{display:block}

header .me{font-size:.88rem;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff;padding:7px 16px;border-radius:980px}
header button.b.sec{background:#fff;color:#0a4cc2;font-weight:700;box-shadow:0 4px 14px rgba(0,20,70,.25)}
nav{display:flex;gap:6px;padding:7px;margin:-30px auto 0;width:max-content;max-width:calc(100% - 28px);overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(10,50,130,.22);position:sticky;top:10px;z-index:5}

nav button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(10,102,232,.4)}
main{padding:28px 32px 80px;max-width:1440px;margin:auto}
h3{font-size:1.15rem;margin:0 0 14px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.panel h3:before{content:"";width:5px;height:1.1em;border-radius:4px;background:var(--grad);display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:14px;margin-bottom:24px}
.kpi{position:relative;overflow:hidden;color:#fff;border:0;border-radius:22px;padding:20px 20px 18px;cursor:pointer;box-shadow:0 10px 24px rgba(10,50,130,.20);transition:transform .15s}
.kpi:hover{transform:translateY(-3px)}
.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.16)}
.kpi .ic{position:absolute;right:16px;top:12px;font-size:1.7rem;opacity:.95;z-index:1;font-style:normal}
.kpi b{display:block;font-size:2.8rem;line-height:1.05;font-weight:800;letter-spacing:-.03em;position:relative;z-index:1}
.kpi span{display:block;margin-top:4px;font-size:.95rem;font-weight:600;opacity:.95;position:relative;z-index:1}
.kpi.blue{background:linear-gradient(135deg,#0a56d6,#2f9bff)}.kpi.red{background:linear-gradient(135deg,#d71a2b,#ff5b6a)}.kpi.orange{background:linear-gradient(135deg,#ee6a00,#ffac2e)}
.kpi.amber{background:linear-gradient(135deg,#b9770e,#f2c029)}.kpi.slate{background:linear-gradient(135deg,#475a78,#7b91b3)}.kpi.cyan{background:linear-gradient(135deg,#0a8fb0,#2fd3d0)}
.kpi.green{background:linear-gradient(135deg,#0b8f4d,#3fd47d)}.kpi.violet{background:linear-gradient(135deg,#5b2fc4,#a77bff)}
.kpi.pink{background:linear-gradient(135deg,#b4137a,#ff4fa3)}
.panel{background:var(--card);border:0;border-radius:22px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:.95rem}
.bar i{display:block;height:12px;border-radius:980px;min-width:8px;background:var(--grad)}
.bar span:first-child{width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx);font-weight:500}
.bar b{font-weight:800}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;padding:14px;background:var(--card);border-radius:20px;box-shadow:var(--sh)}
input,select,textarea,button.b{font:inherit;font-size:.95rem;padding:10px 14px;border:1.5px solid transparent;border-radius:12px;background:var(--row);color:var(--tx)}
input,select,textarea{border-color:var(--bd);transition:box-shadow .15s,border-color .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px rgba(10,102,232,.22);background:var(--card)}
textarea{width:100%;min-height:88px;resize:vertical}
input[type=checkbox]{width:19px;height:19px;padding:0;accent-color:var(--pri);vertical-align:middle}
button.b{cursor:pointer;background:var(--grad);color:var(--on);font-weight:700;padding:10px 22px;border-radius:980px;box-shadow:0 6px 16px rgba(10,102,232,.35);transition:filter .15s,transform .1s}
button.b:hover{filter:brightness(1.08)}button.b:active{transform:scale(.97)}
button.b.sec{background:var(--fill);color:var(--pri);box-shadow:none}button.b.sec:hover{filter:brightness(.96)}
button.b.red{background:linear-gradient(135deg,#d71a2b,#ff5b6a);color:#fff}button.b:disabled{opacity:.45;cursor:not-allowed}
.tw{overflow:auto;border-radius:22px;background:var(--card);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:.96rem}
th,td{padding:15px 16px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td:last-child{min-width:150px}
th{background:linear-gradient(180deg,#eaf2ff,#dfeaff);color:#1d4ba8;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;font-weight:800;position:sticky;top:0;cursor:pointer;white-space:nowrap}
@media(prefers-color-scheme:dark){th{background:linear-gradient(180deg,#1b2c4d,#17253f);color:#8fb6ff}}
tr.row{cursor:pointer;transition:background .12s}tr.row:hover{background:var(--row)}
tr.row td:first-child{box-shadow:inset 5px 0 0 transparent}
tr.row.s-qua td:first-child{box-shadow:inset 5px 0 0 var(--bad)}tr.row.s-sap td:first-child{box-shadow:inset 5px 0 0 #ff9f0a}tr.row.s-ok td:first-child{box-shadow:inset 5px 0 0 var(--ok)}tr.row.s-ip td:first-child{box-shadow:inset 5px 0 0 var(--pri)}
tr.row.s-qua{background:rgba(229,38,47,.045)}
.tag{display:inline-block;padding:4px 14px;border-radius:980px;font-size:.8rem;font-weight:800;white-space:nowrap;color:#fff;letter-spacing:.02em}
.t-Open{background:linear-gradient(135deg,#6b7a99,#93a1bd)}.t-Inprogress{background:linear-gradient(135deg,#0a56d6,#2f9bff)}.t-Pending{background:linear-gradient(135deg,#e07b00,#ffb02e)}.t-Closed{background:linear-gradient(135deg,#0b8f4d,#3fd47d)}
.flag{white-space:nowrap;font-size:.82rem;color:var(--bad);font-weight:800}.flag.w{color:var(--warn)}.mu{color:var(--mu)}
.pager{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:14px}
dialog{border:0;border-radius:26px;background:var(--card);color:var(--tx);max-width:min(960px,96vw);width:960px;padding:0;box-shadow:0 20px 60px rgba(5,20,60,.4);overflow:hidden}
dialog::backdrop{background:rgba(5,20,50,.55)}
.dh{padding:18px 26px;background:linear-gradient(120deg,#06214f,#0a4cc2 60%,#14a0ff);color:#fff;display:flex;justify-content:space-between;align-items:center;font-size:1.15rem}
.dh button.b{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.db{padding:22px 26px;max-height:72vh;overflow:auto}.df{padding:16px 26px;border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--row)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.f label,.db label{display:block;font-size:.82rem;color:var(--mu);margin-bottom:5px;font-weight:700}.f input,.f select,.f textarea{width:100%}.f .w{grid-column:1/-1}
.f input:disabled,.f select:disabled,.f textarea:disabled{background:var(--row);color:var(--mu)}
.db .panel{box-shadow:none;background:var(--row);padding:16px 20px;border-radius:18px;margin-top:14px}
.step{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
.cm{padding:11px 0;border-bottom:1px solid var(--bd)}.cm small{color:var(--mu)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.dmsg{display:none;margin:0 22px 10px;padding:10px 14px;border-radius:8px;font-weight:700;font-size:.92rem}.dmsg.err{display:block;background:#d71a2b;color:#fff}.dmsg.ok{display:block;background:#1d7a4d;color:#fff}.msg{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:14px 26px;border-radius:980px;z-index:99;max-width:90vw;font-size:.97rem;font-weight:600;box-shadow:0 10px 36px rgba(0,0,0,.35)}
.msg.err{background:#d71a2b}.note{font-size:.88rem;color:var(--mu)}.gal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.gal .th{width:84px;height:84px;border-radius:6px;background:var(--line,#456) center/cover no-repeat;border:1px solid var(--line,#456);display:block}.lgt td{vertical-align:top}.hide{display:none!important}
details summary{cursor:pointer;font-weight:700}
a{color:var(--pri);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
/* ưu tiên */
.pr{display:inline-block;padding:3px 11px;border-radius:980px;font-size:.78rem;font-weight:800;white-space:nowrap;color:#fff}
.pr-0{background:linear-gradient(135deg,#d71a2b,#ff5b6a);box-shadow:0 3px 10px rgba(215,26,43,.35)}.pr-1{background:linear-gradient(135deg,#ee6a00,#ffac2e)}.pr-2{background:var(--fill);color:var(--mu)}.pr-3{background:transparent;color:var(--mu);border:1px dashed var(--bd)}
/* dashboard */
.g32{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:18px;margin-bottom:18px}.g32>.panel,.grid2>.panel,.g3>.panel{margin-bottom:0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px}
.urow{display:flex;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:12px;transition:background .12s}.urow:last-child{border-bottom:0}.urow:hover{background:var(--row)}
.urow .ut{flex:1;min-width:0}.urow .ut b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.urow .ut small{color:var(--mu)}
.urow .uf{white-space:nowrap;font-size:.84rem;font-weight:800}.uf.q{color:var(--bad)}.uf.s{color:var(--warn)}.uf.o{color:var(--mu);font-weight:600}
.dnw{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.dn{position:relative;width:150px;height:150px;border-radius:50%;flex:none}.dn:after{content:"";position:absolute;inset:27px;background:var(--card);border-radius:50%}
.dn span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:2rem;font-weight:800;line-height:1}.dn span small{font-size:.72rem;font-weight:600;color:var(--mu);margin-top:3px}
.lg div{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.93rem}.lg i{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}.lg b{margin-left:auto;padding-left:14px}
.sb{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:.93rem}.sb>span{width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sbt{flex:1;display:flex;height:14px;border-radius:980px;overflow:hidden;background:var(--fill)}.sbt i{display:block;height:100%}.sb b{min-width:110px;text-align:right;font-size:.85rem}
.trend{width:100%;height:auto}.trend text{fill:var(--mu);font-size:11px;font-family:inherit}.trend .v{fill:var(--tx);font-weight:700}
@media(max-width:900px){.g32{grid-template-columns:1fr}}
#ld{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,#ffb02e,#ff5b6a);z-index:200;opacity:0;pointer-events:none}
#ld.on{opacity:1;width:85%;transition:width 8s cubic-bezier(.1,.7,.2,1)}
#ld.done{width:100%;opacity:0;transition:width .15s,opacity .35s .15s}
@media(max-width:700px){html{font-size:16px}header{padding:20px 16px 50px}header h1{font-size:1.35rem}main{padding:22px 14px 70px}.kpi b{font-size:2.4rem}nav{width:auto}nav button{padding:10px 16px}}

/* ===== Giao diện kỹ thuật VAECO: phẳng, lưới, chữ số đơn cách, viền mảnh ===== */
:root{--bg:#eef1f5;--card:#fff;--tx:#14202e;--mu:#5d6b7c;--bd:#d3dae3;--pri:#0b3d73;--pri2:#1e6fb8;--row:#f4f6f9;--fill:#e6ebf1;--gold:#b8892b;--sh:none;--grad:#0b3d73;--mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0d141d;--card:#141d29;--tx:#e4eaf2;--mu:#8d9bb0;--bd:#26344a;--pri:#5aa0e6;--pri2:#7db8f0;--row:#182333;--fill:#1d2b3f;--gold:#d9a84a;--sh:none;--grad:#2b6cb0}}
body{background:var(--bg);background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px;background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.93;pointer-events:none;z-index:-1}
header{background:#0a2540;border-bottom:3px solid var(--gold);padding:16px 28px 52px}
header:before,header:after{display:none}
header h1{font-size:1.35rem;letter-spacing:.06em;text-shadow:none;text-transform:uppercase;font-weight:700}
header h1 small{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#c9d6e6;font-weight:500}
header .me{border-radius:3px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);font-family:var(--mono);font-size:.78rem}
header button.b.sec{background:var(--gold);color:#0a2540;box-shadow:none;border-radius:3px}
nav{border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.08);border:1px solid var(--bd);padding:4px;margin-top:-26px}
nav button{border-radius:3px;font-size:.84rem;text-transform:uppercase;letter-spacing:.08em;padding:10px 22px}
nav button.on{background:#0a2540;box-shadow:none;border-bottom:3px solid var(--gold);color:#fff}
@media(prefers-color-scheme:dark){nav button.on{background:#2b6cb0}}
main{padding:22px 28px 70px}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);font-weight:700;margin-bottom:12px}
.panel h3:before{width:3px;height:1em;border-radius:0;background:var(--gold)}
.panel{border:1px solid var(--bd);border-radius:4px;padding:16px 18px;box-shadow:none}
.cards{gap:10px;grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.kpi{background:var(--card)!important;color:var(--tx);border:1px solid var(--bd);border-top:3px solid var(--k,#0b3d73);border-radius:4px;padding:12px 14px;box-shadow:none;text-align:left}
.kpi:hover{transform:none;border-color:var(--k,#0b3d73);background:var(--row)!important}
.kpi:after{display:none}.kpi .ic{display:none}
.kpi b{font-family:var(--mono);font-size:2.1rem;font-weight:600;letter-spacing:-.04em;color:var(--k,#0b3d73)}
.kpi span{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--mu);opacity:1}
.kpi.blue{--k:#1e6fb8}.kpi.red{--k:#c62828}.kpi.orange{--k:#d9660a}.kpi.amber{--k:#a8780a}.kpi.slate{--k:#5d6b7c}.kpi.cyan{--k:#0b8aa3}.kpi.green{--k:#1b8a4e}.kpi.violet{--k:#6a3fb5}.kpi.pink{--k:#b3125e}
@media(prefers-color-scheme:dark){.kpi.blue{--k:#5aa0e6}.kpi.red{--k:#ff6b6b}.kpi.orange{--k:#ffa04d}.kpi.amber{--k:#e8b84a}.kpi.slate{--k:#9fb0c6}.kpi.cyan{--k:#4cc9e0}.kpi.green{--k:#4fd68a}.kpi.violet{--k:#b196f0}.kpi.pink{--k:#ff7ab6}}
.filters{border:1px solid var(--bd);border-radius:4px;box-shadow:none;padding:10px;gap:8px}
input,select,textarea,button.b{border-radius:3px;font-size:.9rem;padding:8px 11px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px rgba(30,111,184,.35)}
button.b{border-radius:3px;box-shadow:none;background:#0a2540;color:#fff;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;padding:9px 16px}
@media(prefers-color-scheme:dark){button.b{background:#2b6cb0}}
button.b.sec{background:var(--fill);color:var(--tx);border:1px solid var(--bd)}
button.b.red,button.b.dng:hover{background:#b3202a;color:#fff;border-color:#b3202a}
button.b.dng{color:#b3202a}
.tw{border:1px solid var(--bd);border-radius:4px;box-shadow:none}
table{font-size:.88rem}th,td{padding:9px 12px}
th{background:#e4eaf1;color:#2a3a4f;font-size:.68rem;letter-spacing:.1em;border-bottom:2px solid var(--pri)}
@media(prefers-color-scheme:dark){th{background:#1a2740;color:#9fb6d6}}
td:nth-child(2),td:nth-child(8),td:nth-child(9){font-family:var(--mono);font-size:.82rem}
tr.row:nth-child(even){background:var(--row)}
tr.row.s-qua{background:rgba(198,40,40,.06)}
.tag{border-radius:2px;padding:2px 9px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;box-shadow:none;background:var(--tg,#5d6b7c)!important}
.t-Open{--tg:#5d6b7c}.t-Inprogress{--tg:#1e6fb8}.t-Pending{--tg:#d9660a}.t-Closed{--tg:#1b8a4e}
.pr-0,.pr-1,.pr-2,.pr-3{border-radius:2px!important;box-shadow:none!important;text-transform:uppercase;letter-spacing:.06em;font-size:.68rem!important}
.pr-0{background:#c62828!important;color:#fff}.pr-1{background:#d9660a!important;color:#fff}
.flag{font-size:.76rem}
dialog{border-radius:4px;border:1px solid var(--bd);box-shadow:0 20px 60px rgba(5,20,40,.5)}
.dh{background:#0a2540;border-bottom:3px solid var(--gold);font-family:var(--mono);font-size:1rem;letter-spacing:.04em;padding:13px 20px}
.dh button.b{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.db .panel{border-radius:3px;background:var(--row)}
.f label,.db label{text-transform:uppercase;letter-spacing:.07em;font-size:.68rem}
.urow{border-radius:0;padding:9px 6px}.urow .uf{font-family:var(--mono);font-size:.78rem}
.sbt{border-radius:0;height:10px}.sbt i,.bar i{border-radius:0}.bar i{background:var(--pri)}
svg rect{rx:1px}
.warnbox{border:1px solid #b3202a;border-left:5px solid #b3202a;background:rgba(179,32,42,.07);padding:12px 14px;border-radius:3px}

function shrink(file){return new Promise(function(ok,no){
  if(!/^image\//.test(file.type)){var r=new FileReader();r.onload=function(){ok({name:file.name,mime:file.type,b64:String(r.result).split(',')[1]})};r.onerror=no;r.readAsDataURL(file);return}
  var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var m=1600,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    ok({name:file.name.replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',b64:c.toDataURL('image/jpeg',.82).split(',')[1]});URL.revokeObjectURL(u)};img.onerror=no;img.src=u})}
function uploadList(id,files,prog,ukey){var l=[].slice.call(files),chain=Promise.resolve(),done=0,sum=0;
  l.forEach(function(f){chain=chain.then(function(){return shrink(f)}).then(function(o){sum+=Math.floor(o.b64.length*3/4);if(sum>50*1048576)throw new Error('Tổng ảnh vượt 50 MB');if(prog)prog(done+1,l.length);return ukey?gs('uploadPublic',id,ukey,o):gs('uploadAttachment',id,o)}).then(function(){done++})});
  return chain}
function upload(files){var id=$('#dlg').dataset.id,b=$('#fl');if(b)b.disabled=true;toast('Đang tải ảnh lên…');
  uploadList(id,files).then(function(){toast('Đã tải lên '+files.length+' tệp');refreshPan(id)}).catch(function(e){toast(e.message,true);refreshPan(id)})}
function loadThumbs(){document.querySelectorAll('[data-th]').forEach(function(el){if(el.dataset.ok)return;el.dataset.ok='1';var id=el.dataset.th;
  if(S.thumb&&S.thumb[id]){el.style.backgroundImage='url('+S.thumb[id]+')';return}
  gs('getFile',id).then(function(f){var u='data:'+f.mime+';base64,'+f.b64;(S.thumb=S.thumb||{})[id]=u;el.style.backgroundImage='url('+u+')'}).catch(function(){})})}
$('#dlg').addEventListener('close',function(){delete $('#dlg').dataset.id});
boot();
</script>
